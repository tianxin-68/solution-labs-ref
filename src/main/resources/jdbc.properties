#redis\uFFFD\uFFFD\uFFFD\uFFFD
#ip\uFFFD\uFFFD\u05B7
redis.hostName= 127.0.0.1
#\uFFFD\u02FF\u06BA\uFFFD
redis.port=6379
#\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD
#redis.password=123456
#\uFFFD\u037B\uFFFD\uFFFD\u02F3\uFFFD\u02B1\u02B1\uFFFD\u4D65\u03BB\uFFFD\u01FA\uFFFD\uFFFD\uFFFD \u012C\uFFFD\uFFFD\uFFFD\uFFFD2000
redis.timeout=10000
redis.database=2
#\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD
redis.maxIdle=8
#\uFFFD\uFFFD\uFFFD\u04F3\u0635\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\u077F\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\u03AA0\uFFFD\uFFFD\u02BE\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD,\uFFFD\uFFFD\uFFFD\uFFFD\uFFFDjedis 2.4\uFFFD\u053A\uFFFD\uFFFD\uFFFDredis.maxTotal
#redis.maxActive=8
#\uFFFD\uFFFD\uFFFD\uFFFD\u04BB\uFFFD\uFFFDpool\uFFFD\u0277\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\u0678\uFFFDjedis\u02B5\uFFFD\uFFFD,\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\u6EFB\uFFFD\uFFFD\uFFFD\uFFFD\uFFFDredis.maxActive,\uFFFD\uFFFD\uFFFD\uFFFD\uFFFDjedis 2.4\uFFFD\u053A\uFFFD\uFFFD\u00F8\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD
redis.maxTotal=8
#\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\u04F5\u0234\uFFFD\u02B1\uFFFD\u4863\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\u02B1\uFFFD\u4F6B\uFFFD\u04F5\uFFFD\uFFFD\uCCE3\uFFFD\uFFFD\uFFFD\uFFFD\u03AA-1\uFFFD\uFFFD\u02BE\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\u01A1\uFFFD
redis.maxWaitMillis=1000
#\uFFFD\uFFFD\uFFFD\u04F5\uFFFD\uFFFD\uFFFD\u0421\uFFFD\uFFFD\uFFFD\uFFFD\u02B1\uFFFD\uFFFD \u012C\uFFFD\uFFFD1800000\uFFFD\uFFFD\uFFFD\uFFFD(30\uFFFD\uFFFD\uFFFD\uFFFD)
redis.minEvictableIdleTimeMillis=300000
#\u00FF\uFFFD\uFFFD\uFFFD\u0377\uFFFD\uFFFD\uFFFD\uFFFD\u04F5\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\u013F,\u012C\uFFFD\uFFFD3
redis.numTestsPerEvictionRun=1024
#\uFFFD\uFFFD\uFFFD\u0268\uFFFD\uFFFD\uFFFD\u02B1\uFFFD\uFFFD\uFFFD\uFFFD(\uFFFD\uFFFD\uFFFD\uFFFD) \uFFFD\uFFFD\uFFFD\u03AA\uFFFD\uFFFD\uFFFD\uFFFD,\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\u07F3\uFFFD, \u012C\uFFFD\uFFFD-1
redis.timeBetweenEvictionRunsMillis=30000
#\uFFFD\u01F7\uFFFD\uFFFD\u06B4\u04F3\uFFFD\uFFFD\uFFFD\u0221\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\u01F0\uFFFD\uFFFD\uFFFD\u043C\uFFFD\uFFFD\uFFFD,\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\u02A7\uFFFD\uFFFD,\uFFFD\uFFFD\u04F3\uFFFD\uFFFD\uFFFD\u0225\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\u04F2\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\u0221\uFFFD\uFFFD\uFFFD\uFFFD\u04BB\uFFFD\uFFFD
redis.testOnBorrow=true
redis.testOnReturn=true
#\uFFFD\u06BF\uFFFD\uFFFD\uFFFD\u02B1\uFFFD\uFFFD\uFFFD\uFFFD\uFFFD\u0427\uFFFD\uFFFD, \u012C\uFFFD\uFFFDfalse
redis.testWhileIdle=true
